openapi: 3.0.3
info:
  title: Portfolio Server
  version: 1.0.0
  description: Combined API reference for the auth, user, skill, achievement, testimonial, experience, blog, project, contact-us, and Cloudinary flows.

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server

tags:
  - name: Auth
  - name: Users
  - name: Skills
  - name: Achievements
  - name: Testimonials
  - name: Experiences
  - name: Blogs
  - name: Projects
  - name: Contact Us
  - name: Cloudinary
  - name: Analytics

paths:
  /user:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: Users fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd001
                        name: Ashu Goyal
                        title: Full-Stack Developer
                        tagline: Building reliable product experiences end-to-end.
                        bio: Full-stack developer building portfolio products and developer tools.
                        email: ashu@example.com
                        avatar:
                          fileName: ashu-profile.png
                          url: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/users/avatar/ashu-goyal.png
                        resume:
                          fileName: ashu-resume.pdf
                          url: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/users/resume/ashu-goyal.pdf
                        aboutHeading: About Me
                        aboutBio: I build products with a focus on clean architecture, performance, and usability.
                        totalYearsExperience: 4+
                        projectsCompleted: 12+
                        location: Jaipur, India
                        paragraphs:
                          - I enjoy building polished web experiences.
                          - I focus on maintainable backend services and product thinking.
                        highlights:
                          - id: highlight-1
                            title: Backend Systems
                            description: Built scalable NestJS services and deployment workflows.
                        socialLinks:
                          - id: social-1
                            name: GitHub
                            icon: github
                            url: https://github.com/ashugoyal
                        skills:
                          - skill_id:
                              _id: 660f0c1f4d8c8b3c2adfd111
                              name: NestJS
                              category: backend
                            yoe: 3
                            scale: 8
                        createdAt: '2026-04-08T06:10:00.000Z'
                        updatedAt: '2026-04-08T06:10:00.000Z'
                    timeStamp: '2026-04-08T06:10:01.000Z'
                    path: /api/v1/user

  /user/{id}:
    get:
      tags:
        - Users
      summary: Get a user by id
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFetchResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd001
                      name: Ashu Goyal
                      title: Full-Stack Developer
                      tagline: Building reliable product experiences end-to-end.
                      bio: Full-stack developer building portfolio products and developer tools.
                      email: ashu@example.com
                      avatar:
                        fileName: ashu-profile.png
                        url: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/users/avatar/ashu-goyal.png
                      resume:
                        fileName: ashu-resume.pdf
                        url: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/users/resume/ashu-goyal.pdf
                      aboutHeading: About Me
                      aboutBio: I build products with a focus on clean architecture, performance, and usability.
                      totalYearsExperience: 4+
                      projectsCompleted: 12+
                      location: Jaipur, India
                      createdAt: '2026-04-08T06:10:00.000Z'
                      updatedAt: '2026-04-08T06:10:00.000Z'
                    timeStamp: '2026-04-08T06:10:01.000Z'
                    path: /api/v1/user/660f0c1f4d8c8b3c2adfd001
        '400':
          $ref: '#/components/responses/InvalidUserIdError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'

    patch:
      tags:
        - Users
      summary: Update a user
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            examples:
              default:
                value:
                  name: Ashu Goyal
                  title: Full-Stack Developer
                  tagline: Building reliable product experiences end-to-end.
                  bio: Building scalable backend systems and product APIs.
                  email: ashu@example.com
                  avatar:
                    fileName: ashu-profile.png
                    url: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/users/avatar/ashu-goyal.png
                    publicId: portfolio/users/avatar/ashu-goyal
                    secureUrl: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/users/avatar/ashu-goyal.png
                    width: 512
                    height: 512
                    format: png
                    resourceType: image
                    bytes: 48212
                    originalFilename: ashu-profile.png
                  resume:
                    fileName: ashu-resume.pdf
                    url: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/users/resume/ashu-goyal.pdf
                    publicId: portfolio/users/resume/ashu-goyal
                    secureUrl: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/users/resume/ashu-goyal.pdf
                    format: pdf
                    resourceType: raw
                    bytes: 240512
                    originalFilename: ashu-resume.pdf
                  aboutHeading: About Me
                  aboutBio: I build products with a focus on clean architecture, performance, and usability.
                  totalYearsExperience: 4+
                  projectsCompleted: 12+
                  location: Jaipur, India
                  paragraphs:
                    - I enjoy building polished web experiences.
                    - I focus on maintainable backend services and product thinking.
                  highlights:
                    - id: highlight-1
                      title: Backend Systems
                      description: Built scalable NestJS services and deployment workflows.
                    - id: highlight-2
                      title: Product UI
                      description: Designed and shipped portfolio and dashboard interfaces.
                  socialLinks:
                    - id: social-1
                      name: GitHub
                      icon: github
                      url: https://github.com/ashugoyal
                    - id: social-2
                      name: LinkedIn
                      icon: linkedin
                      url: https://linkedin.com/in/ashugoyal
                  skills:
                    - skill_id: 660f0c1f4d8c8b3c2adfd111
                      yoe: 4
                      scale: 9
                    - skill_id: 660f0c1f4d8c8b3c2adfd112
                      yoe: 2
                      scale: 7
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMutationResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: User updated successfully.
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd001
                      name: Ashu Goyal
                      title: Full-Stack Developer
                      email: ashu@example.com
                      location: Jaipur, India
                      createdAt: '2026-04-08T06:10:00.000Z'
                      updatedAt: '2026-04-08T06:10:05.000Z'
                    timeStamp: '2026-04-08T06:10:05.000Z'
                    path: /api/v1/user/660f0c1f4d8c8b3c2adfd001
        '400':
          $ref: '#/components/responses/InvalidUserIdError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'

    delete:
      tags:
        - Users
      summary: Delete a user
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: User deleted successfully.
                    timeStamp: '2026-04-08T06:10:03.000Z'
                    path: /api/v1/user/660f0c1f4d8c8b3c2adfd001
        '400':
          $ref: '#/components/responses/InvalidUserIdError'
        '404':
          $ref: '#/components/responses/UserNotFoundError'

  /user/search:
    get:
      tags:
        - Users
      summary: Search users by name or skill id
      parameters:
        - name: name
          in: query
          required: false
          description: Case-insensitive partial user name match.
          schema:
            type: string
            example: ashu
        - name: skill_id
          in: query
          required: false
          description: Filter users who have a specific skill.
          schema:
            type: string
            example: 660f0c1f4d8c8b3c2adfd111
      responses:
        '200':
          description: Users fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              examples:
                byName:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd001
                        name: Ashu Goyal
                        title: Full-Stack Developer
                        bio: Full-stack developer building portfolio products and developer tools.
                        email: ashu@example.com
                        socialLinks:
                          - id: social-1
                            name: GitHub
                            icon: github
                            url: https://github.com/ashugoyal
                        skills:
                          - skill_id:
                              _id: 660f0c1f4d8c8b3c2adfd111
                              name: NestJS
                              category: backend
                            yoe: 3
                            scale: 8
                    timeStamp: '2026-04-08T06:10:04.000Z'
                    path: /api/v1/user/search?name=ashu
                bySkill:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd001
                        name: Ashu Goyal
                        email: ashu@example.com
                        skills:
                          - skill_id:
                              _id: 660f0c1f4d8c8b3c2adfd111
                              name: NestJS
                              category: backend
                            yoe: 3
                            scale: 8
                    timeStamp: '2026-04-08T06:10:04.000Z'
                    path: /api/v1/user/search?skill_id=660f0c1f4d8c8b3c2adfd111
        '400':
          $ref: '#/components/responses/UserSearchBadRequestError'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user with name, email, and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            examples:
              default:
                value:
                  name: Ashu Goyal
                  email: ashu@example.com
                  password: strongPass123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 201
                    message: User registered successfully.
                    data:
                      userId: 660f0c1f4d8c8b3c2adfd001
                    timeStamp: '2026-04-08T06:09:00.000Z'
                    path: /api/v1/auth/register
        '400':
          $ref: '#/components/responses/AuthRegisterBadRequestError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate a user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              default:
                value:
                  email: ashu@example.com
                  password: strongPass123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Authentication successful.
                    data:
                      userId: 660f0c1f4d8c8b3c2adfd001
                    timeStamp: '2026-04-08T06:09:30.000Z'
                    path: /api/v1/auth/login
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'

  /skills:
    post:
      tags:
        - Skills
      summary: Create a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
            examples:
              default:
                value:
                  name: NestJS
                  category: backend
                  icon:
                    publicId: portfolio/skills/nestjs
                    secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                    width: 256
                    height: 256
                    format: png
                    resourceType: image
                    bytes: 48212
                    originalFilename: nestjs-logo
      responses:
        '201':
          description: Skill created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMutationResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 201
                    message: Skill created successfully.
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd111
                      name: NestJS
                      category: backend
                      icon:
                        publicId: portfolio/skills/nestjs
                        secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                      createdAt: '2026-04-08T06:11:00.000Z'
                      updatedAt: '2026-04-08T06:11:00.000Z'
                    timeStamp: '2026-04-08T06:11:00.000Z'
                    path: /api/v1/skills
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Skills
      summary: Get all skills
      responses:
        '200':
          description: Skills fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd111
                        name: NestJS
                        category: backend
                        icon:
                          publicId: portfolio/skills/nestjs
                          secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                        createdAt: '2026-04-08T06:11:00.000Z'
                        updatedAt: '2026-04-08T06:11:00.000Z'
                    timeStamp: '2026-04-08T06:11:01.000Z'
                    path: /api/v1/skills

  /skills/{id}:
    get:
      tags:
        - Skills
      summary: Get a skill by id
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      responses:
        '200':
          description: Skill fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillFetchResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd111
                      name: NestJS
                      category: backend
                      icon:
                        publicId: portfolio/skills/nestjs
                        secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                      createdAt: '2026-04-08T06:11:00.000Z'
                      updatedAt: '2026-04-08T06:11:00.000Z'
                    timeStamp: '2026-04-08T06:11:01.000Z'
                    path: /api/v1/skills/660f0c1f4d8c8b3c2adfd111
        '400':
          $ref: '#/components/responses/InvalidSkillIdError'
        '404':
          $ref: '#/components/responses/SkillNotFoundError'

  /skills/search:
    get:
      tags:
        - Skills
      summary: Search skills by name or category
      parameters:
        - name: name
          in: query
          required: false
          description: Case-insensitive partial skill name match.
          schema:
            type: string
            example: nest
        - name: category
          in: query
          required: false
          description: Skill category filter.
          schema:
            type: string
            enum:
              - frontend
              - language
              - backend
              - database
              - cloud
              - devops
              - design
              - other
            example: backend
      responses:
        '200':
          description: Skills fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
              examples:
                byName:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd111
                        name: NestJS
                        category: backend
                        icon:
                          publicId: portfolio/skills/nestjs
                          secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                        createdAt: '2026-04-08T06:11:00.000Z'
                        updatedAt: '2026-04-08T06:11:00.000Z'
                    timeStamp: '2026-04-08T06:11:02.000Z'
                    path: /api/v1/skills/search?name=nest
                byCategory:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd111
                        name: NestJS
                        category: backend
                        icon:
                          publicId: portfolio/skills/nestjs
                          secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                        createdAt: '2026-04-08T06:11:00.000Z'
                        updatedAt: '2026-04-08T06:11:00.000Z'
                    timeStamp: '2026-04-08T06:11:02.000Z'
                    path: /api/v1/skills/search?category=backend
        '400':
          $ref: '#/components/responses/SkillSearchQueryRequiredError'

    patch:
      tags:
        - Skills
      summary: Update a skill
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillUpdateRequest'
            examples:
              default:
                value:
                  name: NestJS Framework
                  category: backend
      responses:
        '200':
          description: Skill updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMutationResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Skill updated successfully.
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd111
                      name: NestJS Framework
                      category: backend
                      icon:
                        publicId: portfolio/skills/nestjs
                        secureUrl: https://res.cloudinary.com/demo/image/upload/v1/nestjs.png
                      createdAt: '2026-04-08T06:11:00.000Z'
                      updatedAt: '2026-04-08T06:11:05.000Z'
                    timeStamp: '2026-04-08T06:11:05.000Z'
                    path: /api/v1/skills/660f0c1f4d8c8b3c2adfd111
        '400':
          $ref: '#/components/responses/InvalidSkillIdError'
        '404':
          $ref: '#/components/responses/SkillNotFoundError'

    delete:
      tags:
        - Skills
      summary: Delete a skill
      parameters:
        - $ref: '#/components/parameters/MongoIdPathParam'
      responses:
        '200':
          description: Skill deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Skill deleted successfully.
                    timeStamp: '2026-04-08T06:11:03.000Z'
                    path: /api/v1/skills/660f0c1f4d8c8b3c2adfd111
        '400':
          $ref: '#/components/responses/InvalidSkillIdError'
        '404':
          $ref: '#/components/responses/SkillNotFoundError'

  /achievement:
    post:
      tags:
        - Achievements
      summary: Create an achievement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementCreateRequest'
            examples:
              default:
                value:
                  user_id: 660f0c1f4d8c8b3c2adfd001
                  achievement_date: '2025-11-10'
                  title: Hackathon Finals
                  position: winner
                  description: Won the national product engineering challenge.
                  competition_name: Build Bharat Hackathon
                  images:
                    - publicId: portfolio/achievements/build-bharat-hackathon/award-photo
                      secureUrl: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/award-photo.jpg
                      width: 1600
                      height: 900
                      format: jpg
                      resourceType: image
                      bytes: 325841
                      originalFilename: award-photo.jpg
                  certificate_url:
                    publicId: portfolio/achievements/build-bharat-hackathon/certificate
                    secureUrl: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/certificate.pdf
                    format: pdf
                    resourceType: raw
                    bytes: 240512
                    originalFilename: certificate.pdf
              stringCertificate:
                value:
                  user_id: 660f0c1f4d8c8b3c2adfd001
                  achievement_date: '2025-11-10'
                  title: Hackathon Finals
                  position: winner
                  competition_name: Build Bharat Hackathon
                  certificate_url: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/certificate.pdf
      responses:
        '201':
          description: Achievement created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementMutationResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 201
                    message: Achievement created successfully.
                    data:
                      _id: 660f0c1f4d8c8b3c2adfd301
                      user_id: 660f0c1f4d8c8b3c2adfd001
                      achievement_date: '2025-11-10T00:00:00.000Z'
                      title: Hackathon Finals
                      position: winner
                      description: Won the national product engineering challenge.
                      competition_name: Build Bharat Hackathon
                      images:
                        - publicId: portfolio/achievements/build-bharat-hackathon/award-photo
                          secureUrl: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/award-photo.jpg
                          width: 1600
                          height: 900
                          format: jpg
                          resourceType: image
                          bytes: 325841
                          originalFilename: award-photo.jpg
                      certificate_url:
                        publicId: portfolio/achievements/build-bharat-hackathon/certificate
                        secureUrl: https://res.cloudinary.com/demo/raw/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/certificate.pdf
                        format: pdf
                        resourceType: raw
                        bytes: 240512
                        originalFilename: certificate.pdf
                      createdAt: '2026-04-08T06:14:00.000Z'
                      updatedAt: '2026-04-08T06:14:00.000Z'
                    timeStamp: '2026-04-08T06:14:00.000Z'
                    path: /api/v1/achievement
        '400':
          $ref: '#/components/responses/ValidationError'

  /achievement/{user_id}:
    get:
      tags:
        - Achievements
      summary: Get all achievements for a user
      parameters:
        - $ref: '#/components/parameters/UserIdPathParam'
      responses:
        '200':
          description: Achievements fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementListResponse'
              examples:
                default:
                  value:
                    success: true
                    statusCode: 200
                    message: Request successful
                    data:
                      - _id: 660f0c1f4d8c8b3c2adfd301
                        user_id: 660f0c1f4d8c8b3c2adfd001
                        achievement_date: '2025-11-10T00:00:00.000Z'
                        title: Hackathon Finals
                        position: winner
                        competition_name: Build Bharat Hackathon
                        images:
                          - publicId: portfolio/achievements/build-bharat-hackathon/award-photo
                            secureUrl: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/achievements/build-bharat-hackathon/award-photo.jpg
                            width: 1600
                            height: 900
                            format: jpg
                            resourceType: image
                            bytes: 325841
