                        - It exposes validated REST APIs, stores data in MongoDB, and supports Cloudinary-backed media assets.
                      images:
                        - url: https://res.cloudinary.com/demo/image/upload/v1744096800/portfolio/projects/portfolio-server/overview.jpg
