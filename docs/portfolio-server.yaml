                          codeSnippets:
                            - filename: auth.controller.ts
                              language: typescript
                              description:
                                - Example login route declaration
                              code:
                                - "@Post('login')"
                                - "async login(@Body() body: LoginDto) { return this.authService.login(body); }"
                        - subHeading: Project module
                          paragraphs:
                            - Project entries support rich editorial content, media, repository links, and SEO metadata.
                          points:
                            - Nested DTO validation for content sections
                            - Slug uniqueness per user
                    - id: faq
                      contentType: questionBased
                      type: questions
                      heading: Frequently Asked Questions
                      questions:
                        - question: How are media assets stored?
                          answer: Images can be sent either as a Cloudinary asset object or as a plain string URL/public identifier.
                        - question: Does the API reject unknown fields?
                          answer: Yes. The global validation pipe uses whitelist and forbidNonWhitelisted, so extra keys are rejected.
                  database:
                    primary: MongoDB
                    orm: Mongoose
                    collections:
                      - users
                      - projects
                      - blogs
                  apis:
                    auth:
                      - POST /api/v1/auth/register
                      - POST /api/v1/auth/login
